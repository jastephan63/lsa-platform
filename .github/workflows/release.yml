# Release: on a version tag, build both images, push them to GHCR with the
# tag and a digest-stable latest, attach SBOMs, and create a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, analysis]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Multi-arch: amd64 for CI/servers, arm64 for Apple-Silicon laptops.
      # The arm64 half of the R image compiles under QEMU emulation, which is
      # slow — acceptable in a tag-triggered release, wrong for every push.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build and push (linux/amd64, linux/arm64)
        run: |
          ref="ghcr.io/${{ github.repository }}-${{ matrix.image }}"
          docker buildx build -f docker/${{ matrix.image }}.Dockerfile \
            --platform linux/amd64,linux/arm64 \
            -t "$ref:${{ github.ref_name }}" -t "$ref:latest" \
            --push .
      - name: SBOM for the released image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ github.ref_name }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}-${{ github.ref_name }}.spdx.json

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
