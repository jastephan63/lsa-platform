# Release: on a version tag, build both images, push them to GHCR with the
# tag and a digest-stable latest, attach SBOMs, and create a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, analysis]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          ref="ghcr.io/${{ github.repository }}-${{ matrix.image }}"
          docker build -f docker/${{ matrix.image }}.Dockerfile \
            -t "$ref:${{ github.ref_name }}" -t "$ref:latest" .
          docker push "$ref:${{ github.ref_name }}"
          docker push "$ref:latest"
      - name: SBOM for the released image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ github.ref_name }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}-${{ github.ref_name }}.spdx.json

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
