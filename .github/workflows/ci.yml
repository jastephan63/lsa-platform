# CI for lsa-platform. Jobs are added as phases land; every job listed here is
# required to pass — nothing is allowed to be flaky or permanently skipped.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  datagen:
    name: R data generator (runs + reproducible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Generate twice with the same seed and require identical output
        run: |
          Rscript r/datagen/generate.R --seed 20260908 --out /tmp/run-a
          Rscript r/datagen/generate.R --seed 20260908 --out /tmp/run-b
          diff -r --exclude=manifest.csv /tmp/run-a /tmp/run-b
      - name: Sanity-check row counts
        run: |
          test "$(tail -n +2 /tmp/run-a/schools.csv | wc -l)" -gt 50
          test "$(tail -n +2 /tmp/run-a/students.csv | wc -l)" -gt 1000

  python:
    name: Python lint + types + tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lsa
          POSTGRES_USER: lsa_admin
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lsa_admin -d lsa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: lsa
      POSTGRES_USER: lsa_admin
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install package
        working-directory: python
        run: pip install -e '.[dev]'
      - name: Lint (ruff)
        working-directory: python
        run: ruff check .
      - name: Type-check (mypy)
        working-directory: python
        run: mypy
      - name: Apply migrations
        run: ./scripts/migrate.sh
      - name: Tests with coverage (includes DB integration)
        working-directory: python
        run: pytest --cov=lsa --cov-fail-under=75

  r-package:
    name: R CMD check (lsar)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lsa
          POSTGRES_USER: lsa_admin
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lsa_admin -d lsa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: lsa
      POSTGRES_USER: lsa_admin
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/lsar
          extra-packages: any::rcmdcheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load the database so the R-vs-SQL agreement test runs
        run: |
          Rscript r/datagen/generate.R --out data/raw
          ./scripts/migrate.sh
          pip install ./python
          lsa-ingest load --data-dir data/raw --report-dir data/reports --strict
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r/lsar
          error-on: '"warning"'

  sql:
    name: SQL lint + migration test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lsa
          POSTGRES_USER: lsa_admin
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lsa_admin -d lsa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: lsa
      POSTGRES_USER: lsa_admin
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint SQL
        run: |
          pip install sqlfluff
          sqlfluff lint db/
      - name: Apply all migrations to an empty database
        run: ./scripts/migrate.sh
      - name: Re-run to prove idempotence
        run: |
          out="$(./scripts/migrate.sh)"
          echo "$out"
          grep -q "up to date" <<<"$out"
      - name: Assert resulting schema
        run: |
          check() {
            PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -U lsa_admin -d lsa \
              --no-psqlrc -tA -c "$1"
          }
          # 7 domain tables + schema_migrations + api_audit_log
          test "$(check "SELECT count(*) FROM information_schema.tables
                         WHERE table_schema='public' AND table_type='BASE TABLE'")" = "9"
          test "$(check "SELECT count(*) FROM information_schema.views
                         WHERE table_schema='public'")" = "4"
          test "$(check "SELECT count(*) FROM pg_roles
                         WHERE rolname IN ('lsa_api','lsa_analyst')")" = "2"
          # Privilege split: the API role must NOT read base tables; the
          # analyst role may read them; neither reads the audit trail.
          test "$(check "SELECT has_table_privilege('lsa_api','student','SELECT')")" = "f"
          test "$(check "SELECT has_table_privilege('lsa_api','canton_competency','SELECT')")" = "t"
          test "$(check "SELECT has_table_privilege('lsa_api','api_audit_log','INSERT')")" = "t"
          test "$(check "SELECT has_table_privilege('lsa_api','api_audit_log','SELECT')")" = "f"
          test "$(check "SELECT has_table_privilege('lsa_analyst','student','SELECT')")" = "t"
          test "$(check "SELECT has_table_privilege('lsa_analyst','api_audit_log','SELECT')")" = "f"

  backup-restore:
    name: backup + restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lsa
          POSTGRES_USER: lsa_admin
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lsa_admin -d lsa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: lsa
      POSTGRES_USER: lsa_admin
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Populate the database
        run: |
          Rscript r/datagen/generate.R --out data/raw
          ./scripts/migrate.sh
          pip install ./python
          lsa-ingest load --data-dir data/raw --report-dir data/reports --strict
      - name: Backup, destroy, restore — and prove nothing was lost
        run: |
          q() { PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -U lsa_admin -d lsa --no-psqlrc -tA -c "$1"; }
          before="$(q 'SELECT count(*) FROM student')/$(q 'SELECT count(*) FROM response')/$(q 'SELECT count(*) FROM replicate_weight')"
          ./scripts/db_backup.sh --out-dir /tmp/drill
          q 'DELETE FROM replicate_weight; DELETE FROM replicate; DELETE FROM plausible_value;
             DELETE FROM response; DELETE FROM student; DELETE FROM item; DELETE FROM school;'
          test "$(q 'SELECT count(*) FROM student')" = "0"
          ./scripts/db_restore.sh --yes /tmp/drill/lsa-*.dump
          after="$(q 'SELECT count(*) FROM student')/$(q 'SELECT count(*) FROM response')/$(q 'SELECT count(*) FROM replicate_weight')"
          echo "before=$before after=$after"
          test "$before" = "$after"
          # The analytical views must work on the restored database.
          test "$(q 'SELECT count(*) FROM canton_competency')" = "26"

  terraform:
    name: terraform fmt + validate + tflint + docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4.0.1
      - name: terraform fmt
        run: terraform fmt -check -diff
      - name: terraform validate (no backend, no credentials)
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v6.3.1
      - name: tflint
        run: |
          tflint --init
          tflint --format compact
      - name: terraform-docs table is current
        # Pinned to the same version used locally, so the generated table is
        # byte-identical and the diff check cannot false-positive.
        run: |
          curl -sL https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin terraform-docs
          terraform-docs markdown table --output-file README.md --output-mode inject .
          git diff --exit-code -- README.md

  k8s-validate:
    name: kustomize build + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform (kustomize is preinstalled on runners)
        run: |
          kustomize version
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Render overlays and validate against the Kubernetes schemas
        run: |
          kustomize build --load-restrictor=LoadRestrictionsNone k8s/overlays/dev > /tmp/dev.yaml
          kustomize build --load-restrictor=LoadRestrictionsNone k8s/overlays/prod > /tmp/prod.yaml
          kubeconform -strict -summary /tmp/dev.yaml /tmp/prod.yaml

  e2e-kind:
    name: e2e — kind deploy + smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.15.0
        with:
          install_only: true
      - name: Kustomize is preinstalled on runners
        run: kustomize version
      - name: Deploy the whole platform on kind
        env:
          POSTGRES_USER: lsa_admin
          POSTGRES_PASSWORD: ci-only-password
          LSA_API_DB_USER: lsa_api
          LSA_API_DB_PASSWORD: ci-api-password
          LSA_ANALYST_DB_USER: lsa_analyst
          LSA_ANALYST_DB_PASSWORD: ci-analyst-password
        run: ./scripts/kind-up.sh
      - name: Run the smoke-test suite through the ingress
        run: ./scripts/smoke_test.sh --base-url http://localhost:8080
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n lsa get pods -o wide || true
          kubectl -n lsa describe job lsa-setup || true
          kubectl -n lsa logs job/lsa-setup --all-containers --prefix --tail=50 || true
          kubectl -n lsa logs deploy/lsa-api --tail=50 || true

  containers:
    name: Build images, scan (Trivy), SBOM (Syft)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, analysis]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }} image
        run: docker build -f docker/${{ matrix.image }}.Dockerfile -t lsa-${{ matrix.image }}:ci .
      - name: Trivy vulnerability scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lsa-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: lsa-${{ matrix.image }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}.spdx.json

  shell:
    name: shellcheck all scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: every script answers --help
        run: |
          for s in scripts/*.sh; do
            "$s" --help >/dev/null
          done

  dependency-audit:
    name: pip-audit dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit the installed dependency tree
        run: |
          pip install ./python pip-audit
          pip-audit

  hygiene:
    name: pre-commit hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
