# Automated dependency freshness: the Trivy gate and pinned digests only
# stay green if something keeps proposing updates. Dependabot opens PRs for
# each ecosystem; CI decides whether they merge.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /docker
      - /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
