# North-south entry: TLS terminates at the ingress controller (see
# docs/network.md); traffic to the pods is plain HTTP inside the cluster
# network. The dev overlay serves on localhost without TLS; a real
# deployment adds a tls: block backed by cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lsa-api
  labels:
    app.kubernetes.io/name: lsa-api
spec:
  ingressClassName: nginx
  rules:
    - host: lsa.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lsa-api
                port:
                  name: http
