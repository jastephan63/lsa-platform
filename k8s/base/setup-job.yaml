# One ordered setup Job replaces compose's depends_on chain:
#   init 1: wait for postgres  →  init 2: migrate + roles  →
#   init 3: generate data      →  init 4: validate + ingest  →
#   main: R analysis publishes inference for the API
# Init containers run strictly in sequence; the emptyDir volume carries the
# generated CSVs from the datagen step to the ingest step.
apiVersion: batch/v1
kind: Job
metadata:
  name: lsa-setup
  labels:
    app.kubernetes.io/name: lsa-setup
  annotations:
    # Jobs are immutable; under Argo, a changed spec means "run it again".
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lsa-setup
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # -U is required: the pod runs as a uid without a passwd entry, so
          # libpq cannot derive a default username and errors client-side.
          command: ["sh", "-c",
                    "until pg_isready -h \"$POSTGRES_HOST\" -p \"$POSTGRES_PORT\" -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"; do sleep 2; done"]
          envFrom: &setupenv
            - configMapRef:
                name: lsa-config
            - secretRef:
                name: lsa-db-credentials
          resources: &small
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: bootstrap
          image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
          securityContext: *restricted
          command: ["/repo/scripts/bootstrap.sh", "--skip-data"]
          envFrom: *setupenv
          volumeMounts:
            - name: scripts
              mountPath: /repo/scripts
            - name: migrations
              mountPath: /repo/db/migrations
          resources: *small
        - name: datagen
          image: lsa-analysis:local
          securityContext: *restricted
          command: ["Rscript", "/repo/datagen/generate.R", "--out", "/data/raw"]
          volumeMounts:
            - name: datagen-script
              mountPath: /repo/datagen
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp  # R needs a writable TempDir; rootfs is read-only
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        - name: ingest
          image: lsa-api:local
          securityContext: *restricted
          command: ["lsa-ingest", "load", "--data-dir", "/data/raw",
                    "--report-dir", "/data/reports", "--strict"]
          envFrom: *setupenv
          volumeMounts:
            - name: data
              mountPath: /data
          resources: *small
      containers:
        # Runs as the analyst role: computes estimates with SEs/CIs and
        # publishes them into analysis_result for the API to serve.
        - name: publish
          image: lsa-analysis:local
          securityContext: *restricted
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: lsa-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: lsa-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: lsa-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lsa-db-credentials
                  key: LSA_ANALYST_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lsa-db-credentials
                  key: LSA_ANALYST_DB_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: lsa-scripts
            defaultMode: 0555
        - name: migrations
          configMap:
            name: lsa-migrations
        - name: datagen-script
          configMap:
            name: lsa-datagen-script
