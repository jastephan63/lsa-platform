apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsa-api
  labels:
    app.kubernetes.io/name: lsa-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lsa-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lsa-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: lsa-api:local  # dev overlay loads this into kind; prod pins GHCR
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: lsa-config
          env:
            - name: LSA_API_DB_USER
              valueFrom:
                secretKeyRef:
                  name: lsa-db-credentials
                  key: LSA_API_DB_USER
            - name: LSA_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lsa-db-credentials
                  key: LSA_API_DB_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Liveness: process answers at all. Readiness: database reachable
          # as the API role — an unready pod is taken out of the Service.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lsa-api
  labels:
    app.kubernetes.io/name: lsa-api
spec:
  selector:
    app.kubernetes.io/name: lsa-api
  ports:
    - name: http
      port: 80
      targetPort: http
