# Nightly logical backup to a persistent volume. pg_dump runs from the same
# postgres:16 image as the server, so client and server majors cannot drift.
# A real deployment would push the dump to object storage with retention and
# offsite copies; the PVC keeps the demo self-contained. The restore path is
# scripts/db_restore.sh, exercised for real by the backup-restore CI job.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lsa-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lsa-db-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lsa-backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - sh
                - -c
                - |
                  set -eu
                  target="/backups/lsa-$(date +%Y%m%d-%H%M%S).dump"
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
                    --host "$POSTGRES_HOST" --port "$POSTGRES_PORT" \
                    --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
                    --format=custom --compress=6 --file "$target"
                  echo "backup written: $target"
                  # Simple retention: keep the newest 7 dumps.
                  ls -1t /backups/lsa-*.dump 2>/dev/null | tail -n +8 | xargs -r rm --
              envFrom:
                - configMapRef:
                    name: lsa-config
                - secretRef:
                    name: lsa-db-credentials
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: lsa-backups
