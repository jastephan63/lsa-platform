# TLS for the dev cluster: cert-manager with a self-signed issuer. The
# certificate is untrusted by design (local cluster, no real domain) — what
# it demonstrates is the wiring: cert-manager issues into a Secret, the
# Ingress terminates TLS with it, and swapping the issuer for ACME is a
# two-line change in a real deployment.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lsa-tls
  namespace: lsa
spec:
  secretName: lsa-tls
  dnsNames:
    - localhost
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
