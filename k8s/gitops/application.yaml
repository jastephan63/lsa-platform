# Argo CD Application: the pull-based alternative to `make kind-up`'s
# kubectl apply. Argo watches the repository's main branch and keeps the
# cluster converged on k8s/overlays/dev — drift shows up in `argocd app
# diff` / the UI instead of going unnoticed.
#
# Notes:
# - kustomize.buildOptions (the load restrictor) is set in argocd-cm by
#   scripts/gitops-up.sh, because it is server-side Argo configuration.
# - The lsa-setup Job carries a per-resource Replace annotation (Jobs are
#   immutable; a synced change to migrations legitimately means "run it
#   again"). Replace must NOT be global: PVCs reject replacement.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lsa-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jastephan63/lsa-platform
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: lsa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    # The cluster defaults storageClassName on bound claims; that is not drift.
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/storageClassName
        - /spec/volumeName
