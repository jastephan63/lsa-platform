[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lsa"
version = "0.1.0"
description = "Ingestion and API layer of lsa-platform (demonstration project, synthetic data only)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "pip-audit>=2.7",
]

[project.scripts]
lsa-ingest = "lsa.ingest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["lsa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
# Tests assert against concrete expected numbers by nature.
"tests/*" = ["PLR2004"]

[tool.mypy]
strict = true
files = ["lsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["lsa"]
